<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CyTube prototypes</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap"
    />
    <style>
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: var(--space-6);
      }
      h1 {
        font-family: var(--font-display);
        font-size: 1.75rem;
        margin: 0 0 var(--space-2);
      }
      p {
        color: var(--muted);
        margin: 0 0 var(--space-5);
      }
      ul {
        list-style: none;
        padding: 0;
        display: grid;
        gap: var(--space-3);
      }
      a.card {
        display: block;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-4) var(--space-5);
      }
      a.card:hover {
        border-color: var(--accent);
      }
      strong {
        display: block;
        font-family: var(--font-display);
        margin-bottom: var(--space-1);
      }
      span {
        color: var(--muted);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CyTube look</h1>
      <p>Throwaway mockups. 6b ports <code>theme.css</code> into the app.</p>
      <ul>
        <li>
          <a class="card" href="./home.html">
            <strong>Channel directory</strong>
            <span>Browse rooms — populated and empty states.</span>
          </a>
        </li>
        <li>
          <a class="card" href="./room.html">
            <strong>Watch room</strong>
            <span>Player primary, playlist and chat secondary.</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
