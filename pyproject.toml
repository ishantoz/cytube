[project]
name = "cytube"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "fastapi>=0.117.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "pywebview>=6.2.1",
    "uvicorn[standard]>=0.34.0",
    "yt-dlp[default,curl-cffi]>=2026.8.19",
]

[project.scripts]
cytube = "app.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["."]
